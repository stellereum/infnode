[package]
name = "infnode"
version.workspace = true
edition.workspace = true
description = "Инфнод: лёгковесный оверлейный P2P-протокол (QUIC + DHT + storage RF≤3 + rewards + proof-of-storage). Только сетевой слой, без почты."
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
pkcs8 = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
xsalsa20poly1305 = { workspace = true }
aead = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
x25519-dalek = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }
reed-solomon-erasure = { version = "6.0.0", default-features = false }
ml-kem = "0.3"
# PQ handshake Falcon-512 tag backend (lead-ordered, same versions as the
# stellereum crate: no new crypto lineage). INTERIM: unwired — no code
# references these yet; the Falcon tag is blocked on lead-gated PQ identity
# keys (see keyring.rs NodeKeys::id + docs/PQ_TRANSPORT_PLAN.md §7).
falcon-rust = "0.3.1"
pqcrypto-falcon = "0.4.1"
