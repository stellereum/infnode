[package]
name = "infmail"
version.workspace = true
edition.workspace = true
description = "Инфмейл: webmail-сервис поверх сети infnode (аккаунты, письма, файлы, подписки, 2FA, NFT). Отдельный проект, не часть ядра infnode."
license = "MIT OR Apache-2.0"

[dependencies]
infnode = { path = "../infnode" }
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
imap = { workspace = true }
native-tls = { workspace = true }
lettre = { workspace = true }
png = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
ureq = { workspace = true }
x25519-dalek = { workspace = true }

[[bin]]
name = "infmail"
path = "src/main.rs"
